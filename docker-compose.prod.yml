# ---------------------------------------------------------------------------
# Smart Import corriendo como container INDEPENDIENTE en la misma VM del cutter.
#
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml run --rm smart-import list-pbf
#
# Punto clave: /data/pbf monta los _extracts que el cutter YA genera, en READ
# ONLY. No se duplica un solo byte y este servicio no puede tocarlos.
# Ajusta ROUTE_OPTIMIZER_DATA a donde este el repo del cutter en la VM.
# ---------------------------------------------------------------------------
services:
  smart-import:
    build:
      context: .
      target: ${SMART_IMPORT_TARGET:-runtime}
    image: vepathos/smart-import:${IMAGE_TAG:-latest}
    container_name: vepathos-smart-import
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      # PBFs generados por el cutter: SOLO LECTURA
      - ${ROUTE_OPTIMIZER_DATA:-/home/martin/route-optimizer-app/data}/_extracts:/data/pbf:ro
      # artefactos propios de Smart Import, separados de los del cutter
      - smart_import_indexes:/data/indexes
      - smart_import_cache:/data/cache
      - smart_import_tmp:/data/tmp
      # cache de modelos: fuera de la imagen a proposito
      - smart_import_models:/model-cache
      # archivos de trabajo
      - ./data/input:/data/input
      - ./data/output:/data/output
    mem_limit: ${SMART_IMPORT_MEMORY_LIMIT:-4g}
    cpus: ${SMART_IMPORT_CPUS:-2}

volumes:
  smart_import_indexes:
  smart_import_cache:
  smart_import_tmp:
  smart_import_models:
