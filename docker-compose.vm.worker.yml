# ===========================================================================
# Overlay: worker en la VM de PBFs cuando la API vive en api-prod.
# Va JUNTO a docker-compose.worker.yml:
#
#   autossh -M 0 -N -L 18100:127.0.0.1:8100 deploy@178.105.42.199
#   docker compose --env-file .env.worker \
#     -f docker-compose.worker.yml -f docker-compose.vm.worker.yml up -d
#
# Redis y RabbitMQ entran DIRECTO a 178.105.42.199 (whitelist DOCKER-USER).
#
# PLAN A (recomendado): abrir TCP 8100 en Hetzner para las IPs de la VM y usar
# solo docker-compose.worker.yml con SMART_IMPORT_API_URL=http://178.105.42.199:8100
# — ver DEPLOY-PRODUCTION.md §3.1.
#
# PLAN B (este overlay): si 8100 no se puede abrir, tunel SSH en la VM:
#   ssh -f -N -L 18100:127.0.0.1:8100 <host-ssh-api-prod>
# Mismo patron que mac.worker.yml pero solo para la API (Redis/Rabbit van directo).
# ===========================================================================

services:

  worker:
    environment:
      SMART_IMPORT_API_URL: http://host.docker.internal:${SMART_IMPORT_API_TUNNEL_PORT:-18100}
    extra_hosts:
      - "host.docker.internal:host-gateway"
