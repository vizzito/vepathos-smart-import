[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vepathos-smart-import"
version = "0.1.0"
description = "Normaliza archivos de entregas de cualquier formato al schema Vepathos, y geocodifica como accion aparte."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "rapidfuzz>=3.6",
    "charset-normalizer>=3.3",
    "phonenumbers>=8.13",
]

[project.optional-dependencies]
# El geocoder necesita leer PBFs. Se separa para que la imagen base no lo cargue
# si el despliegue solo normaliza.
geo = ["osmium>=4.0"]
# transformers+torch pesan ~2-3 GB. Opt-in explicito: el sistema funciona entero
# con reglas y SMART_IMPORT_AI_ENABLED=false.
ai = ["transformers>=4.40", "torch>=2.2", "accelerate>=0.30"]
dev = ["pytest>=8.0", "psutil>=5.9", "xlwt>=1.3", "pandas>=2.2"]

[project.scripts]
smart-import = "smart_import.cli:main"

[tool.setuptools.packages.find]
include = ["smart_import*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
