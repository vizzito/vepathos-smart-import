[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vepathos-smart-import"
version = "0.1.0"
description = "Normaliza archivos de entregas de cualquier formato al schema Vepathos, y geocodifica como accion aparte."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "rapidfuzz>=3.6",
    "charset-normalizer>=3.3",
    "phonenumbers>=8.13",
]

[project.optional-dependencies]
# El geocoder necesita leer PBFs. Se separa para que la imagen base no lo cargue
# si el despliegue solo normaliza.
geo = ["osmium>=4.0"]
# libpostal: parser internacional de direcciones. Requiere la libreria C + ~2 GB
# de datos, ver docs/libpostal.md. Opcional y apagado por defecto.
libpostal = ["postal>=1.1"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
# Reparto del trabajo entre nodos: cola de tareas, estado compartido y el
# cliente con el que un worker busca los archivos en la api. Es un extra para
# que `pip install .` en una laptop no arrastre clientes de infraestructura,
# pero la imagen de Docker SI lo instala: son tres paquetes puros de ~4 MB que
# nadie importa en modo `embedded`, y tenerlos evita decidir en tiempo de build
# que rol va a cumplir esa maquina — que es justo lo que este reparto busca
# poder cambiar con una variable de entorno.
queue = ["pika>=1.3", "redis>=5.0", "httpx>=0.27"]
dev = ["pytest>=8.0", "psutil>=5.9", "xlwt>=1.3", "pandas>=2.2",
       "fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9",
       "httpx>=0.27"]

[project.scripts]
smart-import = "smart_import.cli:main"

[tool.setuptools.packages.find]
include = ["smart_import*"]

[tool.setuptools.package-data]
# Las etiquetas por idioma son DATOS, no codigo: tienen que viajar con el paquete.
smart_import = ["resources/*.json", "resources/vocab/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "geocoding: geocoding unit tests (synthetic OSM index)",
    "real_geo: needs local PBF extracts under SMART_IMPORT_PBF_DIR / ROUTE_OPTIMIZER_DATA",
    "libpostal: needs brew libpostal + pip postal (SMART_IMPORT_LIBPOSTAL_ENABLED para factory)",
]
